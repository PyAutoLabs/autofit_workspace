nest:
  corner_anesthetic: true   # Output corner figure (using anestetic) during a non-linear search fit?
  corner_anesthetic_components: true   # Also output one corner figure per top-level model component (e.g. per galaxy), each named corner_anesthetic_<component>?
  corner_anesthetic_derived: false   # Output corner figure(s) of the derived parameters (e.g. a shear's magnitude and angle rather than gamma_1 / gamma_2), named corner_anesthetic_derived[_<component>]? Independent of the two above.
mcmc:
  corner_cornerpy: true     # Output corner figure (using corner.py) during a non-linear search fit?
